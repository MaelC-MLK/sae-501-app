controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

auth:
  path: /api/auth
  methods: ['POST']

api_refresh_token:
    path: /api/token/refresh

admin_login:
    path: /admin/login
    controller: App\Controller\AdminSecurityController::login

admin_logout:
    path: /admin/logout
    controller: App\Controller\AdminSecurityController::logout