services:

  nginx:
    container_name: sae-nginx
    image: nginx:latest
    ports:
      - "8080:8080" # backend
      - "8090:8090" # frontend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    depends_on:
      - frontend
      - backend
    networks:
      - sae-network

  frontend:
    container_name: sae-frontend
    build: 
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - sae-network

  backend:
    container_name: sae-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app/backend
    networks:
      - sae-network

  mysql:
    container_name: sae-database
    image: mysql:8
    volumes:
      - database:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: "SAE501"
    networks:
      - sae-network
  
  phpmyadmin:
    container_name: sae-phpmyadmin
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8070:80"
    depends_on:
      - mysql
    networks:
      - sae-network

volumes:
  database:

networks:
  sae-network:
    driver: bridge
